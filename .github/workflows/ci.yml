name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash hosting/scripts/build.sh
      - run: node hosting/scripts/validate-artifact.mjs
      - run: node --test hosting/tests/services.test.mjs
